# SPDX-License-Identifier: AGPL-3.0-only
name: Build Linux VST3 packages
description: Build the Linux plugin and package its corresponding pinned sources.

outputs:
  version:
    description: Project version from CMakeLists.txt
    value: ${{ steps.version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Read project version
      id: version
      shell: bash
      run: |
        python3 - <<'PY'
        import os, pathlib, re
        text = pathlib.Path("CMakeLists.txt").read_text()
        version = re.search(r"project\(SIDSynth VERSION (\d+\.\d+\.\d+)", text)[1]
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            output.write(f"version={version}\n")
        PY

    - name: Install Linux build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          build-essential cmake ninja-build pkg-config python3 curl ca-certificates \
          libasound2-dev libfreetype6-dev libfontconfig1-dev \
          libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev \
          libxrender-dev libxcomposite-dev libxfixes-dev libxi-dev libgl1-mesa-dev

    - name: Cache pinned source archives
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: dependency-downloads
        key: sidsynth-sources-${{ hashFiles('cmake/Dependencies.cmake') }}

    - name: Fetch pinned source archives
      shell: bash
      run: |
        mkdir -p dependency-downloads
        # Match cmake/Dependencies.cmake. CMake and packaging verify both hashes.
        if [[ ! -f dependency-downloads/juce-9.0.5.tar.gz ]]; then
          curl --fail --location --retry 3 \
            https://codeload.github.com/juce-framework/JUCE/tar.gz/d60b7a78030661574a615b586d9325ba7a7fa7dd \
            --output dependency-downloads/juce-9.0.5.tar.gz
        fi
        if [[ ! -f dependency-downloads/libresidfp-1.3.0.tar.gz ]]; then
          curl --fail --location --retry 3 \
            https://codeload.github.com/libsidplayfp/libresidfp/tar.gz/5393471a02a505ff43aa710148b2d35289b72c31 \
            --output dependency-downloads/libresidfp-1.3.0.tar.gz
        fi

    - name: Configure Release plugin without tests
      shell: bash
      env:
        CMAKE_BUILD_PARALLEL_LEVEL: 2
      run: |
        cmake -S . -B build-ci -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTING=OFF \
          -DSIDSYNTH_DEPENDENCY_ARCHIVE_DIR="$GITHUB_WORKSPACE/dependency-downloads"

    - name: Build VST3
      shell: bash
      run: cmake --build build-ci --target SIDSynth_VST3 --parallel 2

    - name: Package binary and corresponding sources
      shell: bash
      run: |
        python3 tools/package_release.py \
          --build build-ci \
          --dependencies dependency-downloads \
          --output build-release

    - name: Describe build
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        {
          echo "### SIDSynth $VERSION — Linux x86_64"
          echo
          echo "Built from commit \`$GITHUB_SHA\` on Ubuntu 24.04."
          echo "Binary VST3, complete source archive and SHA256SUMS are attached as workflow artifacts."
          echo
          echo "Build and packaging only. Automated tests and Renoise checks are not run."
          echo "A build artifact does not create a GitHub Release."
        } >> "$GITHUB_STEP_SUMMARY"
